
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - KATUBA CRM</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 230px;
            background: #222;
            color: white;
            min-height: 100vh;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px 20px;
        }

        .sidebar ul li a:hover {
            background: #961a1a;
        }

        .main {
            flex: 1;
        }

        .topbar {
            background: #961a1a;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content {
            padding: 30px;
        }

        .content h1 {
            margin-bottom: 20px;
        }

        .form-container {
            background: white;
            padding: 25px;
            max-width: 700px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .buttons {
            margin-top: 20px;
        }

        .btn {
            padding: 11px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }

        .btn-save {
            background: #961a1a;
            color: white;
        }

        .btn-cancel {
            background: #777;
            color: white;
            margin-left: 10px;
        }

        .message {
            margin-bottom: 20px;
            padding: 12px;
            display: none;
            border-radius: 5px;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>

<div class="sidebar">

    <h2>KATUBA CRM</h2>

    <ul>
        <li><a href="../dashboard.html">Dashboard</a></li>
        <li><a href="../clients/index.html">Customers</a></li>
        <li><a href="../workers/index.html">Workers</a></li>
        <li><a href="../jobs/index.html">Jobs</a></li>
        <li><a href="index.html">Products</a></li>
        <li><a href="#">Reports</a></li>
        <li><a href="../users/index.html">Users</a></li>
        <li><a href="#" id="logoutBtn">Logout</a></li>
    </ul>

</div>

<div class="main">

    <div class="topbar">
        <div>Edit Product</div>
        <div id="userInfo">Loading...</div>
    </div>

    <div class="content">

        <h1>Edit Product</h1>

        <div id="message" class="message"></div>

        <div class="form-container">

            <form id="editProductForm">

                <input type="hidden" id="id" name="id">

                <div class="form-group">
                    <label for="product_name">Product Name</label>
                    <input
                        type="text"
                        id="product_name"
                        name="product_name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        name="description"
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <input
                        type="text"
                        id="category"
                        name="category"
                    >
                </div>

                <div class="form-group">
                    <label for="price">Price</label>
                    <input
                        type="number"
                        id="price"
                        name="price"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="status">Status</label>

                    <select id="status" name="status">

                        <option value="Active">Active</option>

                        <option value="Inactive">Inactive</option>

                    </select>
                </div>

                <div class="buttons">

                    <button
                        type="submit"
                        class="btn btn-save"
                    >
                        Update Product
                    </button>

                    <a
                        href="index.html"
                        class="btn btn-cancel"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script>

const message = document.getElementById("message");

function showMessage(text, type) {

    message.textContent = text;

    message.className = "message " + type;

    message.style.display = "block";
}


// Get product ID from URL

const params = new URLSearchParams(window.location.search);

const productId = params.get("id");


// Check if ID exists

if (!productId) {

    showMessage(
        "Product ID is missing.",
        "error"
    );

} else {

    loadProduct();

}


// Load product

async function loadProduct() {

    try {

        const response = await fetch(
            "../../backend/products/edit.php?id=" + productId
        );

        const data = await response.json();

        if (!data.success) {

            showMessage(
                data.message,
                "error"
            );

            return;
        }

        const product = data.product;

        document.getElementById("id").value = product.id;

        document.getElementById("product_name").value =
            product.product_name;

        document.getElementById("description").value =
            product.description || "";

        document.getElementById("category").value =
            product.category || "";

        document.getElementById("price").value =
            product.price;

        document.getElementById("quantity").value =
            product.quantity;

        document.getElementById("status").value =
            product.status;

    } catch (error) {

        console.error(error);

        showMessage(
            "Unable to load product.",
            "error"
        );

    }

}


// Update product


 // Update product
document.getElementById("editProductForm")
.addEventListener("submit", async function(event) {
    event.preventDefault();

    const formData = new FormData(this);
    const saveButton = this.querySelector(".btn-save");

    saveButton.disabled = true;
    saveButton.textContent = "Updating...";

    try {
        const response = await fetch(
            "../../backend/products/update.php",
            {
                method: "POST",
                body: formData
            }
        );

        const text = await response.text();
        let data;

        try {
            data = JSON.parse(text);
        } catch {
            throw new Error("The server returned an invalid response.");
        }

        if (!response.ok || !data.success) {
            showMessage(
                data.message || "Unable to update product.",
                "error"
            );
            return;
        }

        showMessage("Product updated successfully! Returning to Products...", "success");

        setTimeout(function() {
            window.location.href = "index.html";
        }, 1200);

    } catch (error) {
        console.error(error);

        showMessage(
            error.message || "Unable to connect to server.",
            "error"
        );
    } finally {
        saveButton.disabled = false;
        saveButton.textContent = "Update Product";
    }
});



// Check logged-in user

async function checkSession() {

    try {

        const response = await fetch(
            "../../backend/auth/check_session.php"
        );

        const data = await response.json();

        if (!data.success) {

            window.location.href = "../login.html";

            return;
        }

        document.getElementById("userInfo").textContent =
            data.user.full_name;

    } catch (error) {

        console.error(error);

    }

}

checkSession();


// Logout

document.getElementById("logoutBtn")
.addEventListener("click", async function(event) {

    event.preventDefault();

    try {

        await fetch(
            "../../backend/auth/logout.php"
        );

        window.location.href = "../login.html";

    } catch (error) {

        console.error(error);

    }

});

</script>

</body>
</html>
