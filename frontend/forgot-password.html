<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KATUBA CRM - Forgot Password</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .forgot-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .description {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .back-login {
            text-align: center;
            margin-top: 20px;
        }

        .back-login a {
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="forgot-box">

    <h1>KATUBA CRM</h1>

    <div class="description">
        Enter your email address and we will check your account.
    </div>

    <form id="forgotPasswordForm">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <button
            type="submit"
            id="resetButton"
        >
            Continue
        </button>

        <div id="message"></div>

    </form>

    <div class="back-login">

        <a href="login.html">
            ← Back to Login
        </a>

    </div>

</div>


<script>

document.getElementById("forgotPasswordForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const message =
            document.getElementById("message");

        const button =
            document.getElementById("resetButton");


        message.textContent = "";


        if (email === "") {

            message.style.color = "red";

            message.textContent =
                "Please enter your email address.";

            return;
        }


        button.disabled = true;

        button.textContent = "Checking...";


        const formData = new FormData();

        formData.append("email", email);


        try {

            const response = await fetch(
                "../backend/password/request.php",
                {
                    method: "POST",
                    body: formData
                }
            );


            const result = await response.json();


            if (result.success) {

                message.style.color = "green";

                message.textContent =
                    "Email verified successfully!";


                button.textContent = "Verified";


                setTimeout(function() {

                    window.location.href =
                        result.reset_link;

                }, 700);


            } else {

                message.style.color = "red";

                message.textContent =
                    result.message;


                button.disabled = false;

                button.textContent = "Continue";

            }


        } catch (error) {

            console.error(error);

            message.style.color = "red";

            message.textContent =
                "Unable to connect to the server.";


            button.disabled = false;

            button.textContent = "Continue";

        }

    }

);

</script>

</body>

</html>
