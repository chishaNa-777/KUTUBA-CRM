
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KATUBA CRM - Workers</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #1f2937;
        }

        .topbar {
            background: #961a1a;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .back-btn {
            background: #1f2937;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
        }

        .container {
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .add-btn, .export-btn {
            color: white;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn {
            background: #15803d;
        }

        .export-btn {
            background: #2563eb;
        }

        .filter-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }

        .filter-group label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
            min-width: 0;
        }

        .clear-btn {
            padding: 11px 15px;
            background: #6b7280;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .results-info {
            margin: 16px 0 0;
            color: #4b5563;
            font-size: 14px;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #1f2937;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .worker-photo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 2px solid #e5e7eb;
            background: #f3f4f6;
        }

        .actions {
            white-space: nowrap;
        }

        .actions a,
        .actions button {
            display: inline-block;
            padding: 7px 10px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            border: none;
            cursor: pointer;
            margin: 2px;
            font-size: 13px;
        }

        .view-btn {
            background: #2563eb;
        }

        .edit-btn {
            background: #f59e0b;
        }

        .delete-btn {
            background: #dc2626;
        }

        .delete-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-active {
            background: #dcfce7;
            color: #166534;
        }

        .status-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .message {
            text-align: center;
            padding: 20px;
        }

        .error {
            color: #b91c1c;
        }

        @media (max-width: 850px) {
            .filter-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            .topbar {
                padding: 16px;
            }

            .container {
                padding: 15px;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

            .header-actions {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <h1>KATUBA CRM</h1>
    <a href="../dashboard.html" class="back-btn">Back to Dashboard</a>
</header>

<main class="container">

    <div class="header">
        <h2>Workers</h2>

        <div class="header-actions">
            <button type="button" id="exportBtn" class="export-btn">
                Export CSV
            </button>

            <a href="add.html" class="add-btn">+ Add Worker</a>
        </div>
    </div>

    <section class="filter-container">
        <div class="filter-grid">
            <div class="filter-group">
                <label for="searchInput">Search Workers</label>
                <input type="search" id="searchInput"
                       placeholder="Search name, phone, email or role...">
            </div>

            <div class="filter-group">
                <label for="statusFilter">Filter by Status</label>
                <select id="statusFilter">
                    <option value="">All statuses</option>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="roleFilter">Filter by Role</label>
                <select id="roleFilter">
                    <option value="">All roles</option>
                </select>
            </div>

            <button type="button" id="clearBtn" class="clear-btn">
                Clear Filters
            </button>
        </div>

        <p id="resultsInfo" class="results-info">Loading workers...</p>
    </section>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Photo</th>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Worker Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="workersTable">
                <tr>
                    <td colspan="8" class="message">Loading workers...</td>
                </tr>
            </tbody>
        </table>
    </div>

</main>

<script>
    const workersTable = document.getElementById("workersTable");
    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");
    const roleFilter = document.getElementById("roleFilter");
    const clearBtn = document.getElementById("clearBtn");
    const exportBtn = document.getElementById("exportBtn");
    const resultsInfo = document.getElementById("resultsInfo");

    let allWorkers = [];

    // Placeholder used when a worker has no photo.
    const placeholderPhoto =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <rect width="100" height="100" fill="#e5e7eb"/>
                <circle cx="50" cy="35" r="18" fill="#9ca3af"/>
                <path d="M15 100 C15 68 32 58 50 58 C68 58 85 68 85 100"
                      fill="#9ca3af"/>
            </svg>
        `);

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function(char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char];
        });
    }

    function getPhotoUrl(photoPath) {
        const path = String(photoPath ?? "").trim();

        if (!path) return placeholderPhoto;

        // Only accept the expected relative upload path.
        if (!/^uploads\/workers\/[a-zA-Z0-9_-]+\.(jpg|png|webp)$/i.test(path)) {
            return placeholderPhoto;
        }

        return "../../" + path;
    }

    function getFilteredWorkers() {
        const search = searchInput.value.trim().toLowerCase();
        const selectedStatus = statusFilter.value.toLowerCase();
        const selectedRole = roleFilter.value.toLowerCase();

        return allWorkers.filter(worker => {
            const searchableText = [
                worker.full_name,
                worker.phone,
                worker.email,
                worker.worker_role
            ].map(value => String(value ?? "").toLowerCase()).join(" ");

            const matchesSearch = searchableText.includes(search);

            const matchesStatus =
                !selectedStatus ||
                String(worker.status ?? "").toLowerCase() === selectedStatus;

            const matchesRole =
                !selectedRole ||
                String(worker.worker_role ?? "").toLowerCase() === selectedRole;

            return matchesSearch && matchesStatus && matchesRole;
        });
    }

    function renderWorkers() {
        const filteredWorkers = getFilteredWorkers();

        resultsInfo.textContent =
            `Showing ${filteredWorkers.length} of ${allWorkers.length} workers`;

        if (filteredWorkers.length === 0) {
            workersTable.innerHTML = `
                <tr>
                    <td colspan="8" class="message">
                        No workers match your search or filters.
                    </td>
                </tr>
            `;
            return;
        }

        workersTable.innerHTML = filteredWorkers.map(worker => {
            const workerId = Number(worker.worker_id);

            const statusClass =
                String(worker.status ?? "").toLowerCase() === "active"
                    ? "status-active"
                    : "status-inactive";

            return `
                <tr>
                    <td>
                        <img
                            class="worker-photo"
                            src="${getPhotoUrl(worker.photo_path)}"
                            alt="Worker photo"
                            loading="lazy"
                            onerror="this.onerror=null;this.src='${placeholderPhoto}'"
                        >
                    </td>
                    <td>${workerId}</td>
                    <td>${escapeHTML(worker.full_name)}</td>
                    <td>${escapeHTML(worker.phone)}</td>
                    <td>${escapeHTML(worker.email)}</td>
                    <td>${escapeHTML(worker.worker_role)}</td>
                    <td>
                        <span class="status-badge ${statusClass}">
                            ${escapeHTML(worker.status || "Unknown")}
                        </span>
                    </td>
                    <td class="actions">
                        <a href="view.html?id=${workerId}" class="view-btn">View</a>
                        <a href="edit.html?id=${workerId}" class="edit-btn">Edit</a>
                        <button type="button" class="delete-btn"
                                data-worker-id="${workerId}">Delete</button>
                    </td>
                </tr>
            `;
        }).join("");
    }

    function populateRoleFilter() {
        const currentRole = roleFilter.value;

        const roles = [...new Set(
            allWorkers
                .map(worker => String(worker.worker_role ?? "").trim())
                .filter(role => role !== "")
        )].sort((a, b) => a.localeCompare(b));

        roleFilter.innerHTML = '<option value="">All roles</option>';

        roles.forEach(role => {
            const option = document.createElement("option");
            option.value = role;
            option.textContent = role;
            roleFilter.appendChild(option);
        });

        if (roles.includes(currentRole)) {
            roleFilter.value = currentRole;
        }
    }

    async function loadWorkers() {
        workersTable.innerHTML = `
            <tr><td colspan="8" class="message">Loading workers...</td></tr>
        `;

        try {
            const response = await fetch("../../backend/workers/get.php", {
                cache: "no-store"
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Unable to load workers.");
            }

            if (!Array.isArray(data.workers)) {
                throw new Error("Invalid workers data received.");
            }

            allWorkers = data.workers.filter(worker => {
                const id = Number(worker.worker_id);
                return Number.isInteger(id) && id > 0;
            });

            populateRoleFilter();
            renderWorkers();

        } catch (error) {
            console.error("Workers loading error:", error);
            resultsInfo.textContent = "Unable to load workers.";

            workersTable.innerHTML = `
                <tr>
                    <td colspan="8" class="message error">
                        Unable to load workers. Check the workers API.
                    </td>
                </tr>
            `;
        }
    }

    searchInput.addEventListener("input", renderWorkers);
    statusFilter.addEventListener("change", renderWorkers);
    roleFilter.addEventListener("change", renderWorkers);

    clearBtn.addEventListener("click", function() {
        searchInput.value = "";
        statusFilter.value = "";
        roleFilter.value = "";
        renderWorkers();
    });

    function csvEscape(value) {
        let text = String(value ?? "");

        if (/^[\s]*[=+\-@]/.test(text)) {
            text = "'" + text;
        }

        return '"' + text.replace(/"/g, '""') + '"';
    }

    exportBtn.addEventListener("click", function() {
        const workers = getFilteredWorkers();

        if (workers.length === 0) {
            alert("There are no workers to export.");
            return;
        }

        const columns = [
            ["Worker ID", "worker_id"],
            ["Full Name", "full_name"],
            ["NRC Number", "nrc_number"],
            ["Phone", "phone"],
            ["Email", "email"],
            ["Address", "address"],
            ["Photo Path", "photo_path"],
            ["Worker Role", "worker_role"],
            ["Experience Years", "experience_years"],
            ["Skills", "skills"],
            ["Availability", "availability"],
            ["NAPSA Number", "napsa_number"],
            ["NHIMA Number", "nhima_number"],
            ["Payment Method", "payment_method"],
            ["Payment Details", "payment_details"],
            ["Start Date", "start_date"],
            ["Status", "status"],
            ["Notes", "notes"],
            ["Created At", "created_at"],
            ["Updated At", "updated_at"]
        ];

        const rows = [
            columns.map(column => csvEscape(column[0])).join(","),
            ...workers.map(worker =>
                columns.map(column => csvEscape(worker[column[1]])).join(",")
            )
        ];

        const blob = new Blob(["\uFEFF" + rows.join("\r\n")], {
            type: "text/csv;charset=utf-8;"
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "katuba_workers.csv";
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    workersTable.addEventListener("click", async function(event) {
        const button = event.target.closest(".delete-btn");

        if (!button) return;

        const workerId = Number(button.dataset.workerId);

        if (!Number.isInteger(workerId) || workerId <= 0) {
            alert("Invalid worker ID.");
            return;
        }

        if (!confirm(
            "Are you sure you want to delete this worker? This action cannot be undone."
        )) {
            return;
        }

        button.disabled = true;

        try {
            const formData = new FormData();
            formData.append("id", String(workerId));

            const response = await fetch("../../backend/workers/delete.php", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            alert(data.message || (
                data.success
                    ? "Worker deleted successfully."
                    : "Unable to delete worker."
            ));

            if (data.success) {
                await loadWorkers();
            } else {
                button.disabled = false;
            }

        } catch (error) {
            console.error("Delete worker error:", error);
            alert("Unable to delete worker. Please check the backend.");
            button.disabled = false;
        }
    });

    loadWorkers();
</script>

</body>
</html>
