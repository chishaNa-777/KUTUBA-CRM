
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KATUBA CRM - Edit Contract</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f5f8;
            color: #252525;
        }

        .topbar {
            background: #961a1a;
            color: white;
            padding: 20px 30px;
        }

        .container {
            max-width: 950px;
            margin: 35px auto;
            padding: 0 18px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,.06);
        }

        h2 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #961a1a;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button, .back-link {
            border: none;
            border-radius: 7px;
            padding: 12px 20px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .save-btn {
            background: #961a1a;
            color: white;
        }

        .back-link {
            background: #eee;
            color: #333;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
            display: none;
        }

        #message.success {
            display: block;
            background: #e8f7ed;
            color: #176b35;
        }

        #message.error {
            display: block;
            background: #fdeaea;
            color: #a51d1d;
        }

        @media(max-width:650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <h2>KATUBA CRM</h2>
    <p>Customer Contracts Management</p>
</header>

<main class="container">
    <section class="card">

        <h2>Edit Contract</h2>
        <p class="subtitle">Update the service agreement details.</p>

        <form id="editContractForm">
            <div class="form-grid">

                <div class="form-group">
                    <label for="contract_number">Contract Number *</label>
                    <input type="text" id="contract_number"
                           name="contract_number" required>
                </div>

                <div class="form-group">
                    <label for="client_id">Customer *</label>
                    <select id="client_id" name="client_id" required>
                        <option value="">Loading customers...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="service_type">Service Type *</label>
                    <input type="text" id="service_type"
                           name="service_type" required>
                </div>

                <div class="form-group">
                    <label for="package">Package *</label>
                    <input type="text" id="package"
                           name="package" required>
                </div>

                <div class="form-group">
                    <label for="start_date">Start Date *</label>
                    <input type="date" id="start_date"
                           name="start_date" required>
                </div>

                <div class="form-group">
                    <label for="end_date">End Date</label>
                    <input type="date" id="end_date" name="end_date">
                </div>

                <div class="form-group">
                    <label for="monthly_fee">Monthly Fee *</label>
                    <input type="number" id="monthly_fee"
                           name="monthly_fee" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="status">Contract Status *</label>
                    <select id="status" name="status" required>
                        <option value="Draft">Draft</option>
                        <option value="Active">Active</option>
                        <option value="Expired">Expired</option>
                        <option value="Terminated">Terminated</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label for="payment_terms">Payment Terms</label>
                    <textarea id="payment_terms"
                              name="payment_terms"></textarea>
                </div>

                <div class="form-group full">
                    <label for="terms_conditions">Terms and Conditions</label>
                    <textarea id="terms_conditions"
                              name="terms_conditions"></textarea>
                </div>

            </div>

            <div class="actions">
                <button type="submit" class="save-btn" id="saveBtn">
                    Update Contract
                </button>

                <a href="index.html" class="back-link">Cancel</a>
            </div>

            <div id="message" role="alert"></div>
        </form>

    </section>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const contractId = params.get("id");

const form = document.getElementById("editContractForm");
const customerSelect = document.getElementById("client_id");
const message = document.getElementById("message");
const saveBtn = document.getElementById("saveBtn");

function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
}

function setField(name, value) {
    document.getElementById(name).value = value ?? "";
}

async function loadCustomers() {
    const response = await fetch("../../backend/clients/get.php", {
        credentials: "same-origin",
        cache: "no-store"
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
        throw new Error(result.message || "Unable to load customers.");
    }

    const customers = Array.isArray(result.clients) ? result.clients : [];

    customerSelect.innerHTML =
        '<option value="">Select a customer</option>';

    customers.forEach(customer => {
        const option = document.createElement("option");
        option.value = customer.client_id;
        option.textContent = customer.full_name;
        customerSelect.appendChild(option);
    });
}

async function loadContract() {
    if (!contractId || !/^\d+$/.test(contractId)) {
        throw new Error("A valid contract ID is required.");
    }

    const response = await fetch(
        "../../backend/contracts/get.php",
        {
            credentials: "same-origin",
            cache: "no-store"
        }
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
        throw new Error(result.message || "Unable to load contract.");
    }

    const contracts = Array.isArray(result.data) ? result.data : [];

    const contract = contracts.find(
        item => String(item.contract_id) === contractId
    );

    if (!contract) {
        throw new Error("Contract not found.");
    }

    setField("contract_number", contract.contract_number);
    setField("client_id", contract.client_id);
    setField("service_type", contract.service_type);
    setField("package", contract.package);
    setField("start_date", String(contract.start_date).slice(0, 10));
    setField("end_date", contract.end_date
        ? String(contract.end_date).slice(0, 10) : "");
    setField("monthly_fee", contract.monthly_fee);
    setField("payment_terms", contract.payment_terms);
    setField("terms_conditions", contract.terms_conditions);
    setField("status", contract.status);
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (!form.reportValidity()) return;

    const startDate = document.getElementById("start_date").value;
    const endDate = document.getElementById("end_date").value;

    if (endDate && endDate < startDate) {
        showMessage("End date cannot be earlier than start date.", "error");
        return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = "Updating...";

    try {
        const formData = new FormData(form);
        formData.append("contract_id", contractId);

        const response = await fetch(
            "../../backend/contracts/edit.php",
            {
                method: "POST",
                body: formData,
                credentials: "same-origin"
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Unable to update contract.");
        }

        showMessage(
            "Contract updated successfully! Returning to contracts...",
            "success"
        );

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1500);

    } catch (error) {
        showMessage(error.message, "error");
    } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Update Contract";
    }
});

async function initializePage() {
    try {
        await loadCustomers();
        await loadContract();
    } catch (error) {
        showMessage(error.message, "error");
        saveBtn.disabled = true;
    }
}

initializePage();
</script>

</body>
</html>
