<header class="topbar">
    <h1>KATUBA CRM</h1>

    <a href="../dashboard.html" class="back-btn">
        ← Back to Dashboard
    </a>
</header>

<main class="container">

    <div class="page-header">
        <h2>Workers</h2>

        <a href="add.html" class="add-btn">
            + Add Worker
        </a>
    </div>

    <div class="table-container">

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Job Title</th>
                    <th>Employment Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="workersTable">
                <tr>
                    <td colspan="8" class="message">
                        Loading workers...
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</main>

<script>
    // LOAD WORKERS
    async function loadWorkers() {
        const table = document.getElementById("workersTable");

        try {
            const response = await fetch("../../backend/workers/get.php");
            const data = await response.json();

            if (!data.success) {
                table.innerHTML = `
                    <tr>
                        <td colspan="8" class="message">
                            ${data.message || "Unable to load workers."}
                        </td>
                    </tr>
                `;
                return;
            }

            const workers = data.workers || [];

            if (workers.length === 0) {
                table.innerHTML = `
                    <tr>
                        <td colspan="8" class="message">
                            No workers found.
                        </td>
                    </tr>
                `;
                return;
            }

            table.innerHTML = "";

            workers.forEach(worker => {
                const status = worker.employment_status || "";
                const statusClass =
                    status.toLowerCase() === "active"
                        ? "status-active"
                        : "status-inactive";

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${worker.id}</td>
                    <td>${worker.first_name || ""}</td>
                    <td>${worker.last_name || ""}</td>
                    <td>${worker.phone || ""}</td>
                    <td>${worker.email || ""}</td>
                    <td>${worker.job_title || ""}</td>
                    <td class="${statusClass}">${status}</td>
                    <td class="actions">
                        <a href="edit.html?id=${worker.id}"
                           class="edit-btn">Edit</a>

                        <button type="button"
                            class="delete-btn"
                            onclick="deleteWorker(${worker.id})">
                            Delete
                        </button>
                    </td>
                `;

                table.appendChild(row);
            });

        } catch (error) {
            console.error(error);

            table.innerHTML = `
                <tr>
                    <td colspan="8" class="message">
                        Unable to load workers. Check your backend file.
                    </td>
                </tr>
            `;
        }
    }

    // DELETE WORKER
    async function deleteWorker(id) {
        if (!confirm("Are you sure you want to delete this worker?")) {
            return;
        }

        const formData = new FormData();
        formData.append("id", id);

        try {
            const response = await fetch(
                "../../backend/workers/delete.php",
                {
                    method: "POST",
                    body: formData
                }
            );

            const data = await response.json();

            alert(data.message || "Request completed.");

            if (data.success) {
                loadWorkers();
            }

        } catch (error) {
            console.error(error);
            alert("Unable to delete worker. Check your backend file.");
        }
    }

    loadWorkers();
</script>
