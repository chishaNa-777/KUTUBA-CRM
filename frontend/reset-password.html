<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KATUBA CRM - Reset Password</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .reset-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .description {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .password-container {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .password-container input {
            width: 100%;
            padding: 12px 60px 12px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        .password-container input:focus {
            border-color: #007bff;
        }

        .view-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            padding: 5px 8px;
            background: transparent;
            color: #007bff;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .view-password:hover {
            background: transparent;
            color: #0056b3;
        }

        .reset-button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .reset-button:hover {
            background: #0056b3;
        }

        .reset-button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .back-login {
            text-align: center;
            margin-top: 20px;
        }

        .back-login a {
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

    </style>

</head>

<body>

<div class="reset-box">

    <h1>KATUBA CRM</h1>

    <div class="description">
        Enter your new password below.
    </div>


    <form id="resetPasswordForm">

        <label for="new_password">
            New Password
        </label>

        <div class="password-container">

            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter new password"
                required
            >

            <button
                type="button"
                class="view-password"
                id="viewNewPassword"
                title="View password"
            >
                👁️
            </button>

        </div>


        <label for="confirm_password">
            Confirm Password
        </label>

        <div class="password-container">

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm new password"
                required
            >

            <button
                type="button"
                class="view-password"
                id="viewConfirmPassword"
                title="View password"
            >
                👁️
            </button>

        </div>


        <button
            type="submit"
            class="reset-button"
            id="resetButton"
        >
            Reset Password
        </button>


        <div id="message"></div>

    </form>


    <div class="back-login">

        <a href="login.html">
            ← Back to Login
        </a>

    </div>

</div>


<script>

// Get secure token from URL

const urlParams = new URLSearchParams(
    window.location.search
);

const token = urlParams.get("token");


// Check if token exists

if (!token) {

    document.getElementById("message").style.color = "red";

    document.getElementById("message").textContent =
        "Invalid or missing password reset link.";

    document.getElementById("resetButton").disabled = true;

}


// Show / hide new password

document.getElementById("viewNewPassword").addEventListener(
    "click",
    function() {

        const passwordInput =
            document.getElementById("new_password");

        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            this.innerHTML = "🚫";

            this.title = "Hide password";

        } else {

            passwordInput.type = "password";

            this.innerHTML = "👁️";

            this.title = "View password";

        }

    }
);


// Show / hide confirm password

document.getElementById("viewConfirmPassword").addEventListener(
    "click",
    function() {

        const passwordInput =
            document.getElementById("confirm_password");

        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            this.innerHTML = "🚫";

            this.title = "Hide password";

        } else {

            passwordInput.type = "password";

            this.innerHTML = "👁️";

            this.title = "View password";

        }

    }
);


// Reset password

document.getElementById("resetPasswordForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const newPassword =
            document.getElementById("new_password").value;

        const confirmPassword =
            document.getElementById("confirm_password").value;

        const message =
            document.getElementById("message");

        const button =
            document.getElementById("resetButton");


        message.textContent = "";


        // Check token

        if (!token) {

            message.style.color = "red";

            message.textContent =
                "Invalid or missing password reset link.";

            return;

        }


        // Check password length

        if (newPassword.length < 6) {

            message.style.color = "red";

            message.textContent =
                "Password must be at least 6 characters.";

            return;

        }


        // Check passwords match

        if (newPassword !== confirmPassword) {

            message.style.color = "red";

            message.textContent =
                "Passwords do not match.";

            return;

        }


        button.disabled = true;

        button.textContent = "Resetting...";


        const formData = new FormData();

        formData.append("token", token);

        formData.append("new_password", newPassword);


        try {

            const response = await fetch(
                "../backend/password/reset.php",
                {
                    method: "POST",
                    body: formData
                }
            );


            const result = await response.json();


            if (result.success) {

                message.style.color = "green";

                message.textContent =
                    "Password changed successfully!";


                button.textContent =
                    "Password Reset";


                setTimeout(function() {

                    window.location.href =
                        "login.html";

                }, 1500);


            } else {

                message.style.color = "red";

                message.textContent =
                    result.message;


                button.disabled = false;

                button.textContent =
                    "Reset Password";

            }


        } catch (error) {

            console.error(error);

            message.style.color = "red";

            message.textContent =
                "Unable to connect to the server.";

            button.disabled = false;

            button.textContent =
                "Reset Password";

        }

    }

);

</script>

</body>

</html>
